# monitor — CT 202 on Hestia, 10.0.0.34
#
# MIRRORS THE LIVE FILE as exported 2026-10-04. Paths literal, not ${VAR}.
#
# THE LXC RESOLVES VIA 10.0.0.1, NOT THE DNS VIP — deliberate, so monitoring
# can still alert when Rhea is down. Set at the LXC, not here:
#   pct set 202 --nameserver 10.0.0.1   (then restart)
#
# Beszel and Dozzle are version-COUPLED to their agents; see
# docs/update-discipline.md before bumping either.

services:
  # Is it up. Service-layer availability; Proxmox quorum covers node-down.
  # On 2.x since the 1.23.17 -> 2.5.0 migration; stay at or above 2.4.0, which
  # patched a LiquidJS RCE in notification templates.
  uptime-kuma:
    image: louislam/uptime-kuma:2.5.0
    container_name: uptime-kuma
    volumes:
      - /opt/appdata/monitor/uptime-kuma:/app/data
    ports:
      - 3001:3001
    restart: unless-stopped

  # Is it healthy. CPU / RAM / disk creep — the hole Kuma structurally cannot
  # cover. Agents run NATIVE on each PVE node, not in containers: an agent
  # inside an LXC reports that container's slice, not the node.
  beszel:
    image: henrygd/beszel:0.20.0
    container_name: beszel
    volumes:
      - /opt/appdata/monitor/beszel:/beszel_data
    ports:
      - 8090:8090
    restart: unless-stopped

  # Everyday notification hub. Telegram is the off-network channel, so alerts
  # survive an ntfy outage.
  ntfy:
    image: binwiederhier/ntfy:v2.28.0
    container_name: ntfy
    command: serve
    environment:
      - NTFY_BASE_URL=http://10.0.0.34:8080
      - NTFY_CACHE_FILE=/var/cache/ntfy/cache.db
      - NTFY_AUTH_FILE=/var/lib/ntfy/user.db
      # ntfy defaults to FULLY OPEN without this.
      - NTFY_AUTH_DEFAULT_ACCESS=deny-all
      - NTFY_BEHIND_PROXY=true
    volumes:
      - /opt/appdata/monitor/ntfy:/var/lib/ntfy
      - /opt/appdata/monitor/ntfy/cache:/var/cache/ntfy
    ports:
      # NOTE: `docker ps` reports `80/tcp, 0.0.0.0:8080->8080/tcp` — port 80 is
      # EXPOSEd but unpublished, and 8080 is published. ntfy's own default
      # listen-http is :80 and no NTFY_LISTEN_HTTP is set here, so whether the
      # server is actually bound to 8080 is not provable from the export.
      # See OPEN-QUESTIONS.md before changing this — it is live config.
      - 8080:8080
    restart: unless-stopped

  # Update NOTIFICATIONS ONLY. Watchtower was dropped deliberately — nothing in
  # this lab auto-updates. Refuses to start without the admin credentials.
  # Watches only THIS daemon, so media/arr/grab get no notifications at all.
  wud:
    image: ghcr.io/getwud/wud:9.2.1
    container_name: wud
    env_file: .env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /opt/appdata/monitor/wud:/store
    ports:
      - 3000:3000
    restart: unless-stopped

  # Live logs only — no persistence anywhere. Actions and shell deliberately
  # NOT enabled (D29). An agent cannot sit behind a socket-proxy, which is why
  # agent mode is both the topology and the security answer.
  dozzle:
    image: amir20/dozzle:v11.1.3
    container_name: dozzle
    environment:
      - DOZZLE_MODE=server
      - DOZZLE_REMOTE_AGENT=10.0.0.30:7007,10.0.0.35:7007,10.0.0.36:7007
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Without /data, users and settings are lost on every recreate.
      - /opt/appdata/monitor/dozzle:/data
    ports:
      # Dozzle listens on 8080 INTERNALLY, not 8888.
      - 8888:8080
    restart: unless-stopped
