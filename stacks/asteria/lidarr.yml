services:
  lidarr:
    image: lscr.io/linuxserver/lidarr:latest
    container_name: lidarr
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
    ports:
      - "${LIDARR_PORT}:8686"
    volumes:
      - "./config/lidarr:/config"
      - "${STORAGE_DIR}:/storage"
    restart: unless-stopped
