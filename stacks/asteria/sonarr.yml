services:
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
    ports:
      - "${SONARR_PORT}:8989"
    volumes:
      - "./config/sonarr:/config"
      - "${STORAGE_DIR}:/storage"
    restart: unless-stopped
