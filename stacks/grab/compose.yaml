# grab — CT 301 on Themis, 10.0.0.36
#
# MIRRORS THE LIVE FILE as exported 2026-10-04. Paths literal, not ${VAR}.
# Services in live-file order (alphabetical).
#
# A CONVENIENCE BUCKET OF UNRELATED DOWNLOADERS, not a coupled system. There is
# no integration to get right here, which is why it tolerates being the loosest
# grouping in the lab.
#
# TWO qBittorrents by design (D30) — the second is NOT YET BUILT; see the note
# at the bottom. The VPN-free instance below is a CONSIDERED divergence from
# every arr guide, not an oversight: MyAnonymouse ties the account to the IPs
# you seed from and wants long-term connectable seeding.

# Project name is pinned so `docker compose` outside /opt/stacks/grab
# still resolves to the same project and does not orphan the containers.
name: grab

services:
  dozzle-agent:
    image: amir20/dozzle:v11.1.3
    container_name: dozzle-agent
    command: agent
    environment:
      - DOZZLE_HOSTNAME=grab
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      # Unauthenticated on the LAN — see OPEN-QUESTIONS.md.
      - 7007:7007
    restart: unless-stopped

  # Outside the media pipeline entirely, so it needs no hardlink flow and no
  # shared sisyphus path — only its own output folder. The jlesage image runs
  # the desktop Java app headless and streams its GUI to the browser, and takes
  # USER_ID/GROUP_ID rather than PUID/PGID. It self-updates its own core at
  # runtime by design; the image stays pinned.
  jdownloader:
    image: jlesage/jdownloader-2:v26.09.1
    container_name: jdownloader
    environment:
      - USER_ID=3004
      - GROUP_ID=3004
      - TZ=America/Toronto
    volumes:
      - /opt/appdata/grab/jdownloader:/config
      - /mnt/sisyphus/downloads/direct/jdownloader:/output
    ports:
      # NO WEB_AUTHENTICATION is set, so this GUI is unauthenticated on the
      # LAN. Confirmed from the live config, not assumed — see
      # OPEN-QUESTIONS.md.
      - 5800:5800
    restart: unless-stopped

  # yt-dlp web UI. Occasional paste, not auto-archiving — Pinchflat, TubeSync
  # and TubeArchivist were rejected as subscription/archival-first.
  # Storage deliberately unentangled from the media pipeline.
  metube:
    image: ghcr.io/alexta69/metube:2026.09.29
    container_name: metube
    environment:
      - UID=3004
      - GID=3004
      - TZ=America/Toronto
      - DOWNLOAD_DIR=/downloads
      - STATE_DIR=/state
      - TEMP_DIR=/tmp-dl
    volumes:
      - /mnt/sisyphus/downloads/direct/metube:/downloads
      # state and temp node-local, not on NFS
      - /opt/appdata/grab/metube/state:/state
      - /opt/appdata/grab/metube/tmp:/tmp-dl
    ports:
      - 8081:8081
    restart: unless-stopped

  # The VPN-FREE instance: owner + abs-arr (MyAnonymouse). Permanent unlimited
  # seeding. 6881 TCP+UDP is forwarded on the ER605 to 10.0.0.36 — it must be
  # connectable. Its category system maps cleanly to arr categories, which is
  # why it beats Deluge.
  # VueTorrent is installed MANUALLY from its release zip into
  # /config/vuetorrent and set as the alternative Web UI — deliberately NOT via
  # the linuxserver mod, which pulls the newest version on every start. It
  # therefore never self-updates: record the installed version.
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:5.2.4_v2.0.15-ls479
    container_name: qbittorrent
    environment:
      - PUID=3004
      - PGID=3004
      - TZ=America/Toronto
      - WEBUI_PORT=8080
      - TORRENTING_PORT=6881
    volumes:
      - /opt/appdata/grab/qbittorrent:/config
      # Same single unified root as arr, at the SAME path string, so imports
      # hardlink instead of copying and seeding continues.
      - /mnt/sisyphus:/data
      - /mnt/incomplete/qbittorrent:/incomplete
    ports:
      - 8080:8080
      - 6881:6881
      - 6881:6881/udp
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # NOT YET BUILT — gluetun + qbittorrent-vpn (D30).
  #
  # Needs first: a Proton VPN Plus subscription, and /dev/net/tun passed into
  # the LXC:   pct set 301 -devN /dev/net/tun
  #
  # Proton (and PIA) are the only providers gluetun's native automatic port
  # forwarding works with — Mullvad dropped port forwarding in 2023. Proton
  # assigns a RANDOM forwarded port, so a helper must push it into
  # qBittorrent's listening port.
  #
  # qbittorrent-vpn uses network_mode: "service:gluetun", so its Web UI port is
  # published on gluetun, not on itself. Own incomplete folder
  # (/mnt/incomplete/qbittorrent-vpn), same /mnt/sisyphus:/data for hardlinks,
  # and seeding limited by ratio/time then removed.
  #
  # VERIFY THE KILL SWITCH before trusting it: stop gluetun and confirm
  # qbittorrent-vpn loses connectivity entirely.
  # ---------------------------------------------------------------------------
