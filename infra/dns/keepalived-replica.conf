# /etc/keepalived/keepalived.conf  —  dns2 (CT 201, Hestia, 10.0.0.32)
#
# Plain VRRP only. NO virtual_server / LVS block: that is what needs the
# ip_vs and xt_set kernel modules an unprivileged LXC cannot load.
# No capability grants or lxc.cap.drop changes were needed.

vrrp_script chk_ftl {
    script "/usr/bin/pgrep pihole-FTL"
    interval 2
    weight -60
    fall 2
    rise 2
}

vrrp_instance VI_DNS {
    state BACKUP
    interface eth0
    virtual_router_id 53
    priority 100
    advert_int 1

    authentication {
        auth_type PASS
        # Max 8 characters — VRRP truncates silently beyond that.
        auth_pass CHANGEME
    }

    virtual_ipaddress {
        10.0.0.33/24
    }

    track_script {
        chk_ftl
    }
}

# Identical to the primary except `state BACKUP` and `priority 100`.
# See keepalived-primary.conf for the weight arithmetic and the deliberate
# decision to leave preemption on.
