# /etc/unbound/unbound.conf.d/pi-hole.conf
# Installed on BOTH dns and dns2. Each Pi-hole has its own local unbound —
# the replica must never forward to the primary's.
#
# Root hints come from the dns-root-data package, so they are not
# hand-maintained here.

server:
    verbosity: 0

    interface: 127.0.0.1
    port: 5335
    do-ip4: yes
    do-udp: yes
    do-tcp: yes

    # IPv4 only in this lab.
    do-ip6: no
    prefer-ip6: no

    harden-glue: yes
    harden-dnssec-stripped: yes

    # Off deliberately: 0x20-encoded random bits break some authoritatives.
    use-caps-for-id: no

    edns-buffer-size: 1232
    prefetch: yes

    num-threads: 1
    so-rcvbuf: 1m

    # DNS-rebinding protection: refuse private addresses in public answers.
    private-address: 192.168.0.0/16
    private-address: 169.254.0.0/16
    private-address: 172.16.0.0/12
    private-address: 10.0.0.0/8
    private-address: fd00::/8
    private-address: fe80::/10
