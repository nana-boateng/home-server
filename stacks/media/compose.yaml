# media — CT 200 on Hestia, 10.0.0.30
#
# MIRRORS THE LIVE FILE as exported 2026-10-04. Paths are literal, not
# ${VAR}: the live .env carries only the three Posterizarr API keys, so an
# interpolated path would resolve empty and force a recreate.
#
# Build record: docs/build-record.md · Gotchas: docs/build-gotchas.md
# Version-coupled: dozzle-agent matches the server in monitor.

# Project name is pinned so `docker compose` outside /opt/stacks/media
# still resolves to the same project and does not orphan the containers.
name: media

services:
  plex:
    image: lscr.io/linuxserver/plex:1.43.4
    container_name: plex
    # host networking for discovery and native remote access (D18).
    network_mode: host
    environment:
      - PUID=3004
      - PGID=3004
      - TZ=America/Toronto
      - VERSION=docker
    # VESTIGIAL: 992 is the container's own `render` group, from the first
    # attempt at passthrough. The device is passed into the LXC owned by group
    # 3004 (`dev0: /dev/dri/renderD128,gid=3004,mode=0660`), which is what
    # actually makes it openable by abc. Kept because it is in the live file
    # and harmless; removing it is a deliberate change, not a cleanup.
    group_add:
      - "992"
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128
    volumes:
      - /opt/appdata/media/plex:/config
      # Least privilege: media only, not the whole share. Nothing here
      # hardlinks, so the single-unified-root rule (D32) does not apply.
      - /mnt/sisyphus/media:/data/media
    # Transcode scratch in RAM. Docker-level because an LXC-level tmpfs into an
    # idmapped container mounts silently nothing. Target is ~1g once measured.
    tmpfs:
      - /transcode:rw,size=4g,uid=3004,gid=3004
    restart: unless-stopped

  jellyfin:
    image: lscr.io/linuxserver/jellyfin:12.1ubu2604-ls50
    container_name: jellyfin
    environment:
      - PUID=3004
      - PGID=3004
      - TZ=America/Toronto
    group_add:
      - "992"
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128
    volumes:
      - /opt/appdata/media/jellyfin:/config
      - /mnt/sisyphus/media:/data/media
    tmpfs:
      - /transcode:rw,size=4g,uid=3004,gid=3004
    ports:
      - 8096:8096
    restart: unless-stopped

  tautulli:
    image: lscr.io/linuxserver/tautulli:v2.18.2-ls245
    container_name: tautulli
    environment:
      - PUID=3004
      - PGID=3004
      - TZ=America/Toronto
    volumes:
      - /opt/appdata/media/tautulli:/config
    ports:
      - 8181:8181
    restart: unless-stopped

  navidrome:
    image: deluan/navidrome:0.64.2
    container_name: navidrome
    user: "3004:3004"
    environment:
      - ND_LOGLEVEL=info
    volumes:
      - /opt/appdata/media/navidrome:/data
      # It serves; it does not acquire. Read-only by design.
      - /mnt/sisyphus/media/audio/music:/music:ro
    ports:
      - 4533:4533
    restart: unless-stopped

  posterizarr:
    image: ghcr.io/fscorrupt/posterizarr:3.3.6
    container_name: posterizarr
    user: "3004:3004"
    # TMDB / Fanart / TVDB keys. Secrets stay on the host, never in the clone.
    env_file: /opt/stacks/media/.env
    environment:
      - TZ=America/Toronto
    volumes:
      - /opt/appdata/media/posterizarr:/config
      - /opt/appdata/media/posterizarr/assets:/assets
    ports:
      # Unauthenticated on the LAN — see OPEN-QUESTIONS.md.
      - 8000:8000
    restart: unless-stopped

  dozzle-agent:
    image: amir20/dozzle:v11.1.3
    container_name: dozzle-agent
    command: agent
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      # Unauthenticated on the LAN — see OPEN-QUESTIONS.md.
      - 7007:7007
    restart: unless-stopped

  # aggregarr — decided (Plex-only) but NOT BUILT. Not in the live file.
