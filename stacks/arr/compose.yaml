# arr — CT 300 on Themis, 10.0.0.35
#
# MIRRORS THE LIVE FILE as exported 2026-10-04. Paths literal, not ${VAR}.
# Services in live-file order (alphabetical) so future diffs stay trivial.
#
# TREATED AS ONE SYSTEM: one compose file, one network, matching PUID/PGID,
# container-name wiring. The download client is deliberately NOT here (it is in
# grab, reached by IP) and there is no VPN sidecar in this stack.
#
# PATHS (D32). /mnt/sisyphus:/data as ONE bind for everything that must
# hardlink — radarr, sonarr, sabnzbd, abs-arr — so a path reported by a
# download client exists unchanged in the importer and no remote path mapping
# is needed. Least privilege for the rest: bazarr and audiobookshelf see only
# media; prowlarr, byparr, recyclarr and reclaimerr see no media at all.

# Project name is pinned so `docker compose` outside /opt/stacks/arr
# still resolves to the same project and does not orphan the containers.
name: arr

services:
  # TORRENT-ONLY as of 0.2.1 (Usenet is on its roadmap). Uses the VPN-FREE
  # qbittorrent in grab, not SAB. Private ghcr image: needs a CLASSIC PAT with
  # read:packages and a `docker login ghcr.io` in this LXC before first up.
  abs-arr:
    image: ghcr.io/nana-boateng/abs-arr:0.2.1
    container_name: abs-arr
    environment:
      - PUID=3004
      - PGID=3004
      - TZ=America/Toronto
    volumes:
      - /opt/appdata/arr/abs-arr:/config
      - /mnt/sisyphus:/data
    ports:
      - 8788:8788
    restart: unless-stopped

  # Lives in arr, NOT media: abs-arr imports into its library and triggers
  # scans, so the pair must share a daemon and filesystem.
  # Official image takes `user:`, not PUID/PGID.
  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:2.37.1
    container_name: audiobookshelf
    user: "3004:3004"
    environment:
      - TZ=America/Toronto
      - PORT=13378
    volumes:
      # /config and /metadata are node-local: they hold listening progress.
      - /opt/appdata/arr/audiobookshelf/config:/config
      - /opt/appdata/arr/audiobookshelf/metadata:/metadata
      - /mnt/sisyphus/media:/data/media
    ports:
      - 13378:13378
    restart: unless-stopped

  # Core only. Mounts ONLY media — never downloads. Whisper AI subtitle
  # generation deferred: it wants a GPU, and Themis's UHD 630 is not passed in.
  bazarr:
    image: lscr.io/linuxserver/bazarr:v1.6.2-ls366
    container_name: bazarr
    environment:
      - PUID=3004
      - PGID=3004
      - TZ=America/Toronto
    volumes:
      - /opt/appdata/arr/bazarr:/config
      - /mnt/sisyphus/media:/data/media
    ports:
      - 6767:6767
    restart: unless-stopped

  # Drop-in FlareSolverr replacement, same API and port 8191. DELIBERATELY NOT
  # PUBLISHED — only Prowlarr talks to it, by container name. Added in Prowlarr
  # as a "FlareSolverr" proxy tagged `flaresolverr`, applied only to
  # Cloudflare-protected indexers. Not monitored: Prowlarr flags tagged
  # indexers if it dies.
  byparr:
    image: ghcr.io/thephaseless/byparr:3.0.4
    container_name: byparr
    environment:
      - TZ=America/Toronto
    restart: unless-stopped

  dozzle-agent:
    image: amir20/dozzle:v11.1.3
    container_name: dozzle-agent
    command: agent
    environment:
      - DOZZLE_HOSTNAME=arr
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      # Unauthenticated on the LAN — see OPEN-QUESTIONS.md.
      - 7007:7007
    restart: unless-stopped

  # Keystone. Indexers go in HERE first, then each arr app is added as an
  # application inside it. abs-arr is added as a READARR app.
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:2.6.5.5623-ls162
    container_name: prowlarr
    environment:
      - PUID=3004
      - PGID=3004
      - TZ=America/Toronto
    volumes:
      - /opt/appdata/arr/prowlarr:/config
    ports:
      - 9696:9696
    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr:6.4.4.10685-ls318
    container_name: radarr
    environment:
      - PUID=3004
      - PGID=3004
      - TZ=America/Toronto
    volumes:
      - /opt/appdata/arr/radarr:/config
      # SINGLE unified root. Split mounts break atomic moves and hardlinks.
      - /mnt/sisyphus:/data
    ports:
      - 7878:7878
    restart: unless-stopped

  # THE ONLY TOOL IN THE STACK THAT PERMANENTLY DELETES MEDIA.
  # Report-only BY CONSTRUCTION: no media mount and no Radarr/Sonarr
  # connection, so it cannot delete even if asked. It reads Plex and Jellyfin
  # over the network. Plex's "Allow media deletion" stays OFF.
  # Enabling deletion needs ALL THREE: off-box backup in place, the
  # Radarr/Sonarr connection added, automatic deletion out of beta.
  reclaimerr:
    image: ghcr.io/jessielw/reclaimerr:0.5.4
    container_name: reclaimerr
    environment:
      - PUID=3004
      - PGID=3004
      - TZ=America/Toronto
    volumes:
      - /opt/appdata/arr/reclaimerr:/app/data
    ports:
      - 8000:8000
    restart: unless-stopped

  # LONG-LIVED with its own cron — not a job that exits. Recyclarr loads EVERY
  # file in configs/, so one merged file per app; see
  # stacks/arr/recyclarr-configs/. secrets.yml is never committed.
  # Not monitored: no UI. Check its log after the daily run.
  recyclarr:
    image: ghcr.io/recyclarr/recyclarr:8.7.2
    container_name: recyclarr
    user: 3004:3004
    environment:
      - TZ=America/Toronto
      - CRON_SCHEDULE=@daily
    volumes:
      - /opt/appdata/arr/recyclarr:/config
    restart: unless-stopped

  # Lives WITH arr, not grab: Usenet is primary and reliable, so they go up and
  # down together, insulated from qBittorrent. Sharing the LXC is also what
  # makes the category paths line up — the #1 SAB failure mode.
  # host_whitelist must include `sabnzbd` or the arr apps are rejected by name.
  sabnzbd:
    image: lscr.io/linuxserver/sabnzbd:5.1.3-ls275
    container_name: sabnzbd
    environment:
      - PUID=3004
      - PGID=3004
      - TZ=America/Toronto
    volumes:
      - /opt/appdata/arr/sabnzbd:/config
      - /mnt/sisyphus:/data
      # Incomplete on the HDD scratch pool, never the SSD.
      - /mnt/incomplete/sabnzbd:/incomplete-downloads
    ports:
      - 8080:8080
    restart: unless-stopped

  sonarr:
    image: lscr.io/linuxserver/sonarr:4.0.20.3014-ls326
    container_name: sonarr
    environment:
      - PUID=3004
      - PGID=3004
      - TZ=America/Toronto
    volumes:
      - /opt/appdata/arr/sonarr:/config
      - /mnt/sisyphus:/data
    ports:
      - 8989:8989
    restart: unless-stopped
