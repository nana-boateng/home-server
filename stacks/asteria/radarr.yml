services:
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
    ports:
      - "${RADARR_PORT}:7878"
    volumes:
      - "./config/radarr:/config"
      - "${STORAGE_DIR}:/storage"
    restart: unless-stopped
