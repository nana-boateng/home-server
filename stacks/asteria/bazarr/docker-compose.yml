services:
  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
    ports:
      - "${BAZARR_PORT}:6767"
    volumes:
      - "./config:/config"
      - "${STORAGE_DIR}:/storage"
    restart: unless-stopped
