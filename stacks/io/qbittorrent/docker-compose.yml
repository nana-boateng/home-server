services:
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      - WEBUI_PORT=8080
      - TORRENTING_PORT=6881
    ports:
      - "${QBITTORRENT_PORT}:8080"
      - "6881:6881"
      - "6881:6881/udp"
    volumes:
      - "./config:/config"
      - "${STORAGE_DIR}:/storage"
    restart: unless-stopped
