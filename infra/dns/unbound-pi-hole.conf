# /etc/unbound/unbound.conf.d/pi-hole.conf
# MIRRORS THE LIVE FILE as exported 2026-10-04. Byte-identical on BOTH dns and
# dns2 — each Pi-hole has its own local unbound, and the replica must never
# forward to the primary's: that would make a Rhea failure take the replica's
# upstream with it, leaving a container that holds the VIP and resolves
# nothing.
#
# Root hints come from the dns-root-data package, not from this file.

server:
    verbosity: 0
    interface: 127.0.0.1
    port: 5335
    do-ip4: yes
    do-udp: yes
    do-tcp: yes
    do-ip6: no
    prefer-ip6: no
    harden-glue: yes
    harden-dnssec-stripped: yes
    use-caps-for-id: no
    edns-buffer-size: 1232
    prefetch: yes
    num-threads: 1
    so-rcvbuf: 1m
    private-address: 10.0.0.0/8
    private-address: 172.16.0.0/12
    private-address: 192.168.0.0/16
    private-address: 169.254.0.0/16
    private-address: fd00::/8
    private-address: fe80::/10
