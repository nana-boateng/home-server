services:
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    environment:
      - TZ=${TZ}
      - PUID=${UID}
      - PGID=${GID}
    # QuickSync hardware transcoding. renderD128 only — never card1.
    # RENDER_GID is the *container's* render group id; read it per-host with
    # `getent group render` inside the LXC. Do not copy a host GID.
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128
    group_add:
      - "${RENDER_GID}"
    ports:
      - '8096:8096'
      - '8920:8920'
    volumes:
      - ${APPDATA_DIR}/apollo/jellyfin:/config
      - ${STORAGE_DIR}:/data
    # Transcode scratch is RAM, never NFS and never the NVMe.
    # Point Jellyfin at /transcode in Dashboard > Playback > Transcode path.
    tmpfs:
      - /transcode:size=4g,mode=1777
    restart: unless-stopped
