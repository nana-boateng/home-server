# Merged from TRaSH templates: remux-web-2160p, web-2160p-combined,
# remux-web-1080p, web-1080p. CF groups at TRaSH defaults;
# originals in ../templates/.
sonarr:
  sonarr:
    base_url: http://sonarr:8989
    api_key: !secret sonarr_apikey

    quality_definition:
      type: series

    quality_profiles:
      - trash_id: 76a5053bdb2d1e4a8f16a69a37d46c12  # Remux + WEB 2160p
        reset_unmatched_scores:
          enabled: true
      - trash_id: c4cadd6b35b95f62c3d47a408e53e2f7  # WEB-2160p (Combined)
        reset_unmatched_scores:
          enabled: true
      - trash_id: fe9470e577c300a5ad9a3274f6d1cdf2  # Remux + WEB 1080p
        reset_unmatched_scores:
          enabled: true
      - trash_id: 72dae194fc92bf828f32cde7744e51a1  # WEB-1080p
        reset_unmatched_scores:
          enabled: true

    custom_format_groups:
      add:
        - trash_id: e9a1944a254e6f8a9da63083f7ae15cb  # [Audio] Audio Formats
          assign_scores_to:
            - trash_id: 76a5053bdb2d1e4a8f16a69a37d46c12  # Remux + WEB 2160p
            - trash_id: fe9470e577c300a5ad9a3274f6d1cdf2  # Remux + WEB 1080p
