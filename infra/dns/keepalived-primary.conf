# /etc/keepalived/keepalived.conf  —  dns (CT 100, Rhea, 10.0.0.31)
# MIRRORS THE LIVE FILE as exported 2026-10-04. auth_pass redacted.
#
# Plain VRRP only. NO virtual_server / LVS block: that is what needs the
# ip_vs and xt_set kernel modules an unprivileged LXC cannot load. No
# capability grants or lxc.cap.drop changes were needed.
#
# THE WEIGHT ARITHMETIC IS THE PART THAT IS EASY TO GET WRONG.
#   150 (priority) - 60 (weight) = 90, BELOW the replica's 100, so the VIP
#   moves when FTL dies. An earlier -40 gave 110 — still above 100 — so FTL
#   could die while this node kept the VIP and pointed every client at a dead
#   resolver. The health check was correct the whole time; only the
#   subtraction was wrong, and nothing logged it.
#   >>> The replica still carries -40. See keepalived-replica.conf. <<<
#
# PREEMPTION IS ON (the default; no `nopreempt`). This node reclaims the VIP
# whenever it is healthy. `nopreempt` was REJECTED because silently running on
# the replica for weeks is the worse failure — the replica's config is a
# one-way copy, so any edit made there vanishes at the next sync.
vrrp_script chk_ftl {
    script "/usr/bin/pgrep pihole-FTL"
    interval 2
    weight -60
    fall 2
    rise 2
}

vrrp_instance VI_DNS {
    state MASTER
    interface eth0
    virtual_router_id 53
    priority 150
    advert_int 1
    authentication {
        auth_type PASS
        auth_pass CHANGEME
    }
    virtual_ipaddress {
        10.0.0.33/24
    }
    track_script {
        chk_ftl
    }
}
