services:
  whisparr:
    image: lscr.io/linuxserver/whisparr:latest
    container_name: whisparr
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
    ports:
      - "${WHISPARR_PORT}:6969"
    volumes:
      - "./config:/config"
      - "${STORAGE_DIR}:/storage"
    restart: unless-stopped
