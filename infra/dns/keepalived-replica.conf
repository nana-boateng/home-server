# /etc/keepalived/keepalived.conf  —  dns2 (CT 201, Hestia, 10.0.0.32)
# MIRRORS THE LIVE FILE as exported 2026-10-04. auth_pass redacted.
#
# !!! ASYMMETRY, RECORDED NOT FIXED !!!
# This file still has `weight -40`. The primary was corrected to -60; this one
# was not. In a two-node pair the backup's weight only changes behaviour when
# BOTH FTLs are dead (replica drops to 60, so the primary at 90 keeps the VIP
# rather than flapping) — so it is not currently harmful. But it is almost
# certainly an unfinished edit rather than a decision, and the docs previously
# claimed this file was "identical except state and priority", which was false.
# Changing it is a live config change, not a doc fix: see OPEN-QUESTIONS.md.
vrrp_script chk_ftl {
    script "/usr/bin/pgrep pihole-FTL"
    interval 2
    weight -40
    fall 2
    rise 2
}

vrrp_instance VI_DNS {
    state BACKUP
    interface eth0
    virtual_router_id 53
    priority 100
    advert_int 1
    authentication {
        auth_type PASS
        auth_pass CHANGEME
    }
    virtual_ipaddress {
        10.0.0.33/24
    }
    track_script {
        chk_ftl
    }
}
